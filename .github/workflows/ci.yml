name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Audit dependencies (high+)
        run: pnpm audit --audit-level high || true

  e2e:
    name: Playwright against local Postgres
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: kacific, POSTGRES_PASSWORD: kacific, POSTGRES_DB: kacific_erp }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U kacific" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://kacific:kacific@localhost:5433/kacific_erp
      DB_DRIVER: pg
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      APP_ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktY2ktZW5jcnlwdGlvbi1rZXk=
      CRON_SECRET: ci-cron-secret
      APP_URL: http://localhost:3000
      EMAIL_TRANSPORT: outbox
      INTEGRATIONS_MOCK: "1"
      AI_MOCK: "1"
      LOGIN_RATE_LIMIT: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
        env: { E2E_START: "start" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  docker:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
